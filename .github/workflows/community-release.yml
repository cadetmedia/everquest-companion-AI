# Publish a COMMUNITY build to this fork's Releases page, on a `community-*` tag.
#
# The fork's own workflow, beside the creator's build.yml, which it never touches: build.yml runs on
# pushes to `main` and on `v*` tags, and this one only on `community-*` tags, so neither can start
# the other. The procedure it automates is docs/community/RELEASING.md; the human act is pushing the
# tag (`git tag community-<version> <main_community commit> && git push origin community-<version>`).
#
# WHAT IT DOES, in order, and any step failing stops the release:
#   1. the tag must be exactly `community-<package.json version>` (a tag never ships another version);
#   2. typecheck, lint, and the unit suite, where only the known reds may fail, by name
#      (scripts/community/known-reds.sh);
#   3. build the engine (release) and the TEST installer, unsigned, publishing nothing;
#   4. scripts/community/publish-release.sh --publish, which re-checks the installer, the update
#      file and the blockmap, that the tagged commit is on main_community and contains the version's
#      `Test build` notes commit, then creates the release with the installer, test.yml, the blockmap,
#      the previous release's blockmap and SHA256SUMS.txt, marked Latest.
#
# Least privilege: the only token with write is this job's, and it is used only by `gh` in step 4.
# Actions are pinned to the same commit SHAs build.yml uses. The tag reaches scripts as the env var
# GITHUB_REF_NAME, never pasted into a `run:` body.

name: community-release

on:
  push:
    tags: ['community-*']
  # Started by hand (Actions tab, or the API) on main_community: for a session whose network
  # cannot push tags. The release step's `gh release create --target` then creates the tag
  # community-<package.json version> on that commit, exactly as a pushed tag would have named it.
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: community-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history, for the notes and branch checks)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
        with:
          fetch-depth: 0
          persist-credentials: false

      # The runner checks text out as CRLF (git's Windows default), which the suite expects: some
      # fixtures are real game files that ARE CRLF, and turning autocrlf off failed five tests. Only
      # our bash scripts need LF, because bash cannot run a CRLF script; convert just those.
      - name: LF for the release scripts
        shell: bash
        run: sed -i 's/\r$//' scripts/community/*.sh

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4 (v4.4.0)
        with:
          node-version: 24
          cache: npm

      - name: The tag names this version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" != "main_community" ]; then
              echo "STOP: a hand-started release runs on main_community only, not $GITHUB_REF_NAME" >&2
              exit 1
            fi
          elif [ "$GITHUB_REF_NAME" != "community-$version" ]; then
            echo "STOP: tag $GITHUB_REF_NAME does not match package.json version $version (expected community-$version)" >&2
            exit 1
          fi
          echo "releasing $version"

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary
        run: npm run deps:electron

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (only the known reds may fail)
        shell: bash
        run: bash scripts/community/known-reds.sh

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4 (v4.3.0)
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            engine/target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock', 'engine/rust-toolchain.toml') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - name: Build the engine (release)
        run: |
          rustup show active-toolchain
          npm run build:engine

      - name: Build the installer (unsigned, publishes nothing)
        shell: pwsh
        run: |
          npm run build
          npx electron-builder --win --publish never

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/community/publish-release.sh --publish --target "$GITHUB_SHA"
